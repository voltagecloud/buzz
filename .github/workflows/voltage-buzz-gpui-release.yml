name: Buzz GPUI Release

# Builds the GPUI client's packages and publishes them as a release of this
# repository, which the in-app updater reads (apps/buzz-gpui/crates/app/src/
# updates). Ports apps/buzz-gpui/.github/workflows/build.yml, which GitHub does
# not run from a subdirectory.
#
# A release is <upstream version>+voltage.<n>, tagged v<version>. Each release
# for an upstream version takes the next n, so it sorts after the release
# before it and after the upstream release of the same version, and the
# suffix keeps the tag clear of the upstream block/buzz v* tags. Pull requests
# that change the packaging build the packages without publishing them.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/voltage-buzz-gpui-release.yml
      - apps/buzz-gpui/.github/actions/**
      - apps/buzz-gpui/scripts/package-*
      - apps/buzz-gpui/scripts/build-package.sh
      - apps/buzz-gpui/scripts/*-appimage.sh
      # What the AppImage and --gst-check lanes exercise in the app.
      - apps/buzz-gpui/crates/app/src/appimage.rs
      - apps/buzz-gpui/crates/app/src/gst_bundle.rs
      - apps/buzz-gpui/scripts/check-remote-provider.mjs
      - apps/buzz-gpui/scripts/check-remote-provider.test.mjs
      - apps/buzz-gpui/scripts/test-package-build.py
      - apps/buzz-gpui/scripts/bundle-macos-*
      - apps/buzz-gpui/scripts/check-macos-*

concurrency:
  group: buzz-gpui-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Ship the Remote workspace UI and its provider on every desktop platform.
  BUZZ_GPUI_VOLTAGE: "1"

jobs:
  package-contract:
    name: Desktop package contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - run: python3 apps/buzz-gpui/scripts/test-package-build.py
      - run: node --test apps/buzz-gpui/scripts/check-remote-provider.test.mjs

  version:
    name: GPUI release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      upstream: ${{ steps.version.outputs.upstream }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - id: version
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          upstream=$(python3 -c 'import tomllib; print(tomllib.load(open("apps/buzz-gpui/Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          echo "upstream=benthecarman/buzz-gpui $(sed -n 's/^ref=//p' apps/buzz-gpui/UPSTREAM) ($(sed -n 's/^commit=//p' apps/buzz-gpui/UPSTREAM))" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" != workflow_dispatch ]; then
            echo "version=$upstream+voltage.0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$REF" != refs/heads/main ]; then
            echo "::error::Releases are built from main only."
            exit 1
          fi
          last=$(git ls-remote --tags origin \
            | sed -nE "s#.*refs/tags/v${upstream//./\\.}\+voltage\.([0-9]+)\$#\1#p" \
            | sort -n | tail -1)
          echo "version=$upstream+voltage.$(( ${last:-0} + 1 ))" >> "$GITHUB_OUTPUT"

  linux:
    name: GPUI Linux ${{ matrix.arch }} (.deb, .AppImage)
    needs: [version, package-contract]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    env:
      BUZZ_GPUI_RELEASE_VERSION: ${{ needs.version.outputs.version }}
      BUZZ_GPUI_APPIMAGE: "1"
    defaults:
      run:
        working-directory: apps/buzz-gpui
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      # Builds inside ubuntu:24.04, so the packages link Ubuntu's libraries
      # and need only its glibc.
      - run: scripts/package-deb.sh
      # The AppImage runs on other distributions, with only what it carries
      # and the desktop libraries every system has.
      - run: scripts/check-appimage.sh dist/*.AppImage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: buzz-gpui-linux-${{ matrix.arch }}
          path: |
            apps/buzz-gpui/dist/*.deb
            apps/buzz-gpui/dist/*.AppImage
          if-no-files-found: error

  macos:
    name: GPUI macOS ${{ matrix.arch }} (.dmg)
    needs: [version, package-contract]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          # Cross-compiled on Apple Silicon: the Intel runner took about
          # 51 minutes to build what macos-14 builds in 17.
          - runner: macos-14
            arch: x86_64
            rust-target: x86_64-apple-darwin
    env:
      BUZZ_GPUI_RELEASE_VERSION: ${{ needs.version.outputs.version }}
      BUZZ_GPUI_MACOS_ARCH: ${{ matrix.arch }}
      # The root rust-toolchain.toml pins block/buzz's Rust, and rustup reads
      # it from apps/buzz-gpui too, so name the GPUI toolchain explicitly.
      RUSTUP_TOOLCHAIN: 1.98.1
    defaults:
      run:
        working-directory: apps/buzz-gpui
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./apps/buzz-gpui/.github/actions/gstreamer
      # The Rust that the Nix dev shell gets from the locked nixpkgs.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.rust-target }}
      # The x86_64 checks run the bundled Node and provider under Rosetta.
      - if: matrix.arch == 'x86_64'
        run: sudo softwareupdate --install-rosetta --agree-to-license
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          workspaces: apps/buzz-gpui
          # Both architectures now share a runner image; keep their caches apart.
          key: ${{ matrix.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # Keep the release build when packaging fails after it.
          cache-on-failure: true
      - run: scripts/package-macos.sh
      # The bundle loads only what it carries, and plays media with the
      # GStreamer framework moved away.
      - run: scripts/check-macos-dmg.sh dist/*.dmg
      - run: ls -l dist/*.dmg
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: buzz-gpui-macos-${{ matrix.arch }}
          path: apps/buzz-gpui/dist/*.dmg
          if-no-files-found: error

  windows:
    name: GPUI Windows x86_64 (.zip)
    needs: [version, package-contract]
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      BUZZ_GPUI_RELEASE_VERSION: ${{ needs.version.outputs.version }}
      RUSTUP_TOOLCHAIN: 1.98.1
    steps:
      # The buzz-app git dependencies have paths past MAX_PATH.
      - run: git config --system core.longpaths true
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./apps/buzz-gpui/.github/actions/gstreamer
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          workspaces: apps/buzz-gpui
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: bash scripts/build-package.sh -p buzzd
        working-directory: apps/buzz-gpui
      - run: |
          python -m pip install pefile
          python scripts/package-windows.py "$env:GSTREAMER_ROOT"
        working-directory: apps/buzz-gpui
      # The bundled Node runs every bundled plugin.
      - run: dist/Buzz/lib/buzz-gpui/node/bin/node.exe scripts/check-plugins.mjs dist/Buzz/share/buzz-gpui/plugins
        working-directory: apps/buzz-gpui
      - run: dist/Buzz/lib/buzz-gpui/node/bin/node.exe scripts/check-remote-provider.mjs dist/Buzz/bin/buzz-backend-relay.exe
        working-directory: apps/buzz-gpui
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: buzz-gpui-windows-x86_64
          path: apps/buzz-gpui/dist/*.zip
          if-no-files-found: error

  release:
    name: GPUI publish release
    if: github.event_name == 'workflow_dispatch'
    needs: [version, linux, macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: buzz-gpui-*
          merge-multiple: true
      # The in-app updater installs a package only if its checksum is listed
      # here.
      - run: cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      # The release stays a draft until every asset is up, so installed copies
      # never see it half uploaded. Publishing marks it latest, which is the
      # release the updater reads.
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
          UPSTREAM: ${{ needs.version.outputs.upstream }}
        run: |
          notes="Buzz GPUI built from $GITHUB_REPOSITORY@$GITHUB_SHA, on $UPSTREAM."
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Buzz GPUI ${TAG#v}" --notes "$notes" --draft
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

  # Nix users install a release through the flake's buzz-gpui-voltage-bin,
  # which pins the release's AppImages in apps/buzz-gpui/nix/release.json.
  # main takes changes only through reviewed pull requests, so this proposes
  # the new pin as one. A job of its own, so a failure here can be re-run
  # without publishing the release again.
  nix-pin:
    name: GPUI pin the release for Nix
    if: github.event_name == 'workflow_dispatch'
    needs: [version, release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: buzz-gpui-linux-*
          merge-multiple: true
      - run: python3 apps/buzz-gpui/scripts/pin-nix-release.py "$VERSION" "$GITHUB_REPOSITORY" dist
        env:
          VERSION: ${{ needs.version.outputs.version }}
      # A commit made through the API is signed by GitHub, as main requires.
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          branch="chore/gpui-nix-pin-v$VERSION"
          title="chore(gpui): pin Buzz GPUI $VERSION for Nix"
          # A re-run starts the branch, which only this job writes, again.
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" >/dev/null 2>&1 || true
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/$branch" -f sha="$GITHUB_SHA" >/dev/null
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" --arg branch "$branch" --arg head "$GITHUB_SHA" \
            --arg headline "$title" \
            --arg contents "$(base64 -w0 apps/buzz-gpui/nix/release.json)" \
            '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: { input: {
                branch: { repositoryNameWithOwner: $repository, branchName: $branch },
                expectedHeadOid: $head,
                message: {
                  headline: $headline,
                  body: "Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
                },
                fileChanges: { additions: [ { path: "apps/buzz-gpui/nix/release.json", contents: $contents } ] }
              } }
            }' | gh api graphql --input - >/dev/null
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" --title "$title" \
            --body "Points the flake's \`buzz-gpui-voltage-bin\` at the AppImages of [v$VERSION]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/v$VERSION). Generated by the release workflow."
