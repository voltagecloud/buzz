[package]
name = "buzz-sandbox-reaper"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "In-cluster reaper for ended and orphaned Buzz Agent Sandbox sessions (docs/remote-agents.md §Sandbox lifecycle)"

[[bin]]
name = "buzz-sandbox-reaper"
path = "src/main.rs"

# Heavy, cluster-only dependencies (aws-sdk-s3, axum, metrics) live here and
# never in buzz-backend-kubernetes, whose binary ships inside the desktop app.
[dependencies]
buzz-backend-kubernetes = { path = "../buzz-backend-kubernetes" }
buzz-sdk = { workspace = true }
buzz-session-control = { workspace = true }
buzz-ws-client = { workspace = true }
nostr = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
kube = { workspace = true, features = ["runtime"] }
k8s-openapi = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
axum = { workspace = true }
http = "1"
http-body-util = "0.1"
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
aws-config = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-sdk-secretsmanager = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
# The enrollment GitHub login check (`enroll.rs`).
reqwest = { workspace = true }
toml = "1.0"
zeroize = { workspace = true }
# Same reason as buzz-backend-kubernetes: the process-level CryptoProvider is
# installed explicitly because the workspace unifies ring and aws-lc-rs.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[dev-dependencies]
buzz-backend-kubernetes = { path = "../buzz-backend-kubernetes", features = ["test-utils"] }
# The relay provider's end-to-end tests run against this crate's fake relay
# and the manager in process (serve::relay_provider_tests).
buzz-backend-relay = { path = "../buzz-backend-relay" }
tokio-tungstenite = { workspace = true }
tower = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
proptest = { workspace = true }
