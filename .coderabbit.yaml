# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Remote-agent work lands as stacked pull requests, so most bases are other
# feature branches. CodeRabbit reviews only default-branch PRs unless
# base_branches lists more. Drafts stay unreviewed until marked ready.
reviews:
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - ".*"
