[package]
name = "buzz-remote-sessions"
# Every key is explicit, with no `workspace = true` inheritance: the GPUI
# client (`apps/buzz-gpui`, its own workspace) consumes this crate by path.
version = "0.1.0"
edition = "2021"
rust-version = "1.88.0"
license = "Apache-2.0"
publish = false
description = "Client for Buzz remote-agent provider binaries and thread-bound sandbox sessions"

[dependencies]
dirs = "6"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt"] }
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time"] }
