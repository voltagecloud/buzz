[package]
name = "buzz-identity"
description = "The human's Buzz key: keyring custody and purpose-bound signing"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.22"
buzz-keychain = { path = "../keychain" }
buzz-desktop.workspace = true
nostr = { version = "=0.45.5", default-features = false, features = ["std", "nip44", "os-rng"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
url = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = "1.9"
# The owner's kind 24210 enroll request to the Sandbox manager, signed
# here so the key stays in this crate. It uses nostr 0.44.
buzz-session-control = { path = "../../../../crates/buzz-session-control", optional = true }
nostr-wire = { package = "nostr", version = "0.44", optional = true }

[features]
session-control = ["dep:buzz-session-control", "dep:nostr-wire"]

[dev-dependencies]
secp256k1 = { version = "0.31", features = ["std"] }
