name: Voltage Commons mobile

on:
  workflow_dispatch:
  pull_request:
    paths:
      - mobile/**
      - voltage/mobile/**
      - scripts/prepare-commons-ios.sh
      - scripts/test-commons-brand.py
      - .github/workflows/voltage-commons-mobile.yml

permissions:
  contents: read

concurrency:
  group: voltage-commons-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: Commons unsigned iOS build
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
      - name: Check distribution configuration
        run: python3 scripts/test-commons-brand.py -v
      - name: Configure Commons
        run: scripts/prepare-commons-ios.sh
      - name: Install dependencies
        run: cd mobile && flutter pub get
      - name: Test Commons presentation
        run: cd mobile && flutter test --no-pub --dart-define=BUZZ_APP_VARIANT=voltage-commons test/shared/branding/app_brand_test.dart
      - name: Build complete unsigned Commons app
        run: cd mobile && flutter build ios --release --no-codesign --no-pub
